version: '3.8'

services:
  mariadb:
    # 11.4: exigência do Moodle 5.3 (26/10/2026). MARIADB_AUTO_UPGRADE atualiza as tabelas de sistema ao trocar de versão.
    image: mariadb:11.4
    container_name: moodle_db
    restart: unless-stopped
    environment:
      MARIADB_AUTO_UPGRADE: "1"
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS}
      MYSQL_DATABASE: moodle
      MYSQL_USER: moodleuser
      MYSQL_PASSWORD: ${DB_PASS}
    volumes:
      - dbdata:/var/lib/mysql
    command: >
      --innodb_buffer_pool_size=256M
      --innodb_log_file_size=64M
      --innodb_flush_log_at_trx_commit=2
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7-alpine
    container_name: moodle_redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru

  moodle:
    build: .
    container_name: moodle_app
    restart: unless-stopped
    depends_on:
      - mariadb
      - redis
    volumes:
      - moodledata:/var/www/moodledata
      - ./public/enrol_programa.php:/var/www/html/public/enrol_programa.php
      - ./public/enrol_discipline.php:/var/www/html/public/enrol_discipline.php
      - ./public/enrolled_check.php:/var/www/html/public/enrolled_check.php
      - ./public/conteudo:/var/www/html/public/conteudo
      # Moodle 5.3: a raiz do site é public/, então as regras de endereço vão em public/.htaccess
      - ./htaccess-root.conf:/var/www/html/public/.htaccess
      - ./config.prod.php:/var/www/html/config.php
    ports:
      - "127.0.0.1:8080:80"
    environment:
      MOODLE_URL: https://pos.engenhariabiomedica.com

  nginx:
    image: nginx:alpine
    container_name: moodle_nginx
    restart: unless-stopped
    depends_on:
      - moodle
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./public/conteudo:/var/www/html/public/conteudo:ro
      # Moodle da Cultivee (outro repositório, em /opt/moodle-cultivee): config do nginx e aulas.
      # Clonar /opt/moodle-cultivee ANTES de recriar este nginx: se o arquivo não existir, o Docker
      # cria uma pasta no lugar e o nginx não sobe.
      - /opt/moodle-cultivee/nginx/cursos.cultivee.com.br.conf:/etc/nginx/conf.d/cultivee.conf:ro
      - /opt/moodle-cultivee/conteudo:/var/www/cultivee/conteudo:ro
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - webroot:/var/www/certbot

  certbot:
    image: certbot/certbot
    container_name: moodle_certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - webroot:/var/www/certbot

volumes:
  dbdata:
  moodledata:
  certbot-etc:
  certbot-var:
  webroot:
