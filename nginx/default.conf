# Não mostrar a versão do nginx (vale para todos os sites deste nginx)
server_tokens off;

server {
    listen 80;
    server_name pos.engenhariabiomedica.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name pos.engenhariabiomedica.com;

    ssl_certificate /etc/letsencrypt/live/pos.engenhariabiomedica.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pos.engenhariabiomedica.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 256M;

    # Segurança (26/10/2026): só HTTPS por 1 ano e sem mostrar a versão do PHP
    add_header Strict-Transport-Security "max-age=31536000" always;
    proxy_hide_header X-Powered-By;

    # Arquivos que mostram a versão exata do Moodle ou não servem ao público
    # (lista da documentação do Moodle para nginx)
    location ~ (/vendor/|/node_modules/|composer\.json|/readme|/README|readme\.txt|/upgrade\.txt|/UPGRADING\.md|db/install\.xml|/fixtures/|/behat/|phpunit\.xml|\.lock|environment\.xml) {
        return 404;
    }

    # Arquivos estáticos servidos diretamente pelo Nginx (sem proxy para Apache)
    # Muito mais rápido para vídeos grandes e PDFs
    location /conteudo/ {
        alias /var/www/html/public/conteudo/;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff;

        # Videos: cache mais longo
        location ~* \.mp4$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options nosniff;
        }
    }

    # Tudo o resto vai para o Moodle (Apache)
    location / {
        proxy_pass http://moodle:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
    }
}

# ---------------------------------------------------------------------------
# greenhouse.cognivise.com.br: app de terceiro (compose em /home/andre/greenhouse,
# container greenhouse_app na rede moodle_default). Bloco escrito direto no servidor
# e trazido para o git em 17/10/2026 sem alteração.
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name greenhouse.cognivise.com.br;
    client_max_body_size 20M;

    # Renovação do Let's Encrypt (faltava: o certificado venceu em 23/08/2026 sem renovar)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Permite baixar o binário do firmware diretamente via HTTP sem forçar HTTPS (evita erro -1 / estouro de memória de TLS no ESP32)
    location /static/uploads/ {
        proxy_pass http://greenhouse_app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Desativa o buffering para permitir streaming direto de arquivos grandes/OTA
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }

    # Redireciona automaticamente todo o restante do tráfego HTTP para HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name greenhouse.cognivise.com.br;
    client_max_body_size 20M;

    # Caminho dos certificados gerados pelo Certbot (ajuste se o nome da pasta mudar)
    ssl_certificate /etc/letsencrypt/live/greenhouse.cognivise.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/greenhouse.cognivise.com.br/privkey.pem;

    location / {
    	proxy_pass http://greenhouse_app:8000;
    	proxy_set_header Host $host;
    	proxy_set_header X-Real-IP $remote_addr;
    	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    	proxy_set_header X-Forwarded-Proto $scheme;

    	# Parâmetros adicionados para suportar o upload do firmware sem timeout:
    	proxy_read_timeout 300s;
    	proxy_connect_timeout 300s;
    	proxy_send_timeout 300s;
    	client_max_body_size 10M;
    }

}

